# =====================================================================
#  Family tree site configuration
#  Edit this file, rebuild the data (see README.md), and reload.
#  Any key you delete falls back to a sensible default.
#  This is the per-site configuration: family details, sheet URL and
#  Google account mappings live here, not in the application code.
# =====================================================================

site:
  title: "Peru Iyers (Perumbavoor Iyers)"
  subtitle: "Family tree and stories"
  intro: "Trace how we are connected, read the stories behind the names."
  footer: "Built from our family relatives sheet"
  # Who the tree opens on: a sheet PID such as I000 (patriarch), or "home"
  # for the importer's fallback (the first visible person).
  default_person: I000
  # GitHub repo (owner/name) that receives "suggest a correction" issues.
  # Leave empty to hide the links.
  repo: "evolvedHow/kula"

# Where the public data comes from. The Google Sheet is the source of truth.
# Share it as "Anyone with the link can view", then run scripts/import_sheet.py.
source:
  sheet_url: "https://docs.google.com/spreadsheets/d/1qlGP7U0z3hRp9aeq_S4KUj5p9bfbHZjdZS6tuMkucjc/edit?usp=sharing"
  # Optional local cache written by the importer (git-ignored).
  cache: "private/relatives-sheet.xlsx"
  # Tab names in the workbook. Change these if you reuse the app with a
  # workbook that uses different tab names.
  tabs:
    persons: "Persons"
    vedic: "Vedic"
    config: "$Config"
    unions: "Unions"
    offsprings: "Offsprings"
  # The older hierarchical family sheet is the authority for birth, death and
  # living status. It is matched to the Persons tab by name; authority values
  # win, but blank authority cells never erase current data. Remove this block
  # to import only the relational sheet.
  authority:
    sheet_url: "https://docs.google.com/spreadsheets/d/10sC17l2apMUhDj02TA4Rpgv4D56t0j4SWCoSK57senM/edit?usp=sharing"
    cache: "private/original-sheet.xlsx"
    # Empty scans every tab that has a recognisable name header.
    tabs: []
    # Fuzzy name-match threshold (0-1). Date, birth place and status only
    # break ties between similar names.
    min_score: 0.86
    candidate_score: 0.80
    # Header names in the original sheet. Add aliases here if you reuse the
    # importer with a differently worded workbook.
    columns:
      name: ["Full Name", "Name", "Person"]
      dob: ["Date of birth", "DOB", "Birth date"]
      pob: ["Place of birth", "POB", "Birth place"]
      status: ["Living/Deceased", "Living or deceased", "Status"]
      dod: ["Date of death", "DOD", "Death date"]
      pod: ["Place of death", "POD", "Death place"]

theme:
  # Pick a palette from the `presets:` section below (or add your own there)
  preset: sage
  # auto follows the visitor's device setting; light and dark are fixed
  mode: auto
  # Optional per-colour overrides, applied on top of the preset
  colors:
    light: {}
    dark: {}

fonts:
  # Bundled in docs/assets/fonts. Roboto is self-hosted (variable, 100–900).
  # To use other fonts, replace the files and @font-face rules in docs/assets/fonts.css.
  heading: "Roboto"
  body: "Roboto"

layout:
  # hourglass = ancestors above, descendants below · ancestors · descendants
  default_view: graph
  # vertical = generations top-to-bottom · horizontal = generations left-to-right
  orientation: vertical
  generations_up: 4
  generations_down: 4
  card_width: 188
  card_height: 84
  gap_x: 26
  gap_y: 92
  corner_radius: 16
  # angular = right-angled connectors · curved = bezier connectors
  connector_style: angular
  show_years: true
  show_places: true
  show_child_counts: true

narratives:
  enabled: true
  # Shown in navigation and headings
  section_title: "Stories"
  # Gramps note types always treated as stories
  note_types: [Blog, Narrative, Story, Biography, Memoir]
  # Gramps note tags that mark a note as a story (case-insensitive)
  tags: [blog, story, narrative]
  # Ordinary Person/Family/Event/Place notes become stories when they are at least min_words long
  auto_detect_types: [Person Note, Family Note, Event Note, Place Note]
  min_words: 200
  # Optional display titles by Gramps note ID. Without an override the first
  # line of the note is used, or the story is shown as "Untitled story".
  story_titles:
    N0047: "The Patriarch and Matriarch"
  # Attach a story/note to extra relatives (Gramps IDs) without editing the
  # note in Gramps. It then appears on each listed person's panel and in the
  # story's "Tagged relatives" section. Rebuild after changing this.
  story_tags:
    N0047: [I0000]

# ---------------------------------------------------------------------
#  Vedic data and birth charts (jadagam)
# ---------------------------------------------------------------------
vedic:
  # When true, a sidereal birth chart is computed at import time for every
  # person whose DOB includes a time AND who has a POB. The Jadagam button
  # appears on their profile. Requires the optional venv dependencies:
  #   python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
  # then run the importer with .venv/bin/python.
  charts: true

# Hand-verified geocodes for birth places. These always win over the cached
# Nominatim lookups in private/geocache.json. Use them to fix a place that
# resolves to the wrong town, or to pin down an unambiguous timezone.
# places:
#   Valliyur: { lat: 8.3833, lon: 77.6667, tz: "Asia/Kolkata" }
#   Marietta: { lat: 33.9526, lon: -84.5499, tz: "America/New_York" }
places: {}

privacy:
  # Applied by scripts/build_site.py before data is written. Privacy is only
  # real if it happens at build time: the published JSON contains only what
  # survives these rules.
  # Everything in Gramps is published. Set to true to hide living people again.
  hide_living: false
  # A person with no death event is treated as living if born within this many years
  living_years: 100
  # Shown in place of a living person's name (only when hide_living is true)
  living_label: "Living"
  # Gramps IDs to publish even if the rules above would hide them, e.g. ["I0000"].
  always_public: []
  # Gramps records marked private are removed completely (false = publish them too)
  respect_private_flag: false
  # Notes with any of these tags are never published (empty = publish everything)
  exclude_tags: []
  # Stories that name a living person in full: redact = replace the name with living_label
  # (the story still publishes); drop = leave the story out entirely
  scan_stories_for_living_names: false
  living_names_in_stories: redact
  include_notes: true

text:
  search_placeholder: "Find a family member…"
  tree_tab: "Tree"
  people_tab: "Everyone"
  stories_tab: "Stories"
  set_me: "This is me"
  view_hourglass: "Both"
  view_ancestors: "Ancestors"
  view_descendants: "Descendants"
  view_graph: "Relatives"
  view_vertical: "Vertical"
  view_horizontal: "Horizontal"
  tagged_people: "Tagged relatives"
  read_story: "Read story"
  back: "Back"

# ---------------------------------------------------------------------
#  Google sign-in (optional)
#  Client-side only: it identifies a visitor and can set "This is me".
#  It does not make the site private. Keep privacy rules in the build.
# ---------------------------------------------------------------------
auth:
  google:
    # Create an OAuth 2.0 Web client at https://console.cloud.google.com/apis/credentials
    # and add the site origin (for example https://evolvedhow.github.io) to
    # "Authorized JavaScript origins". Leave empty to hide Google sign-in.
    client_id: "941843963930-a7hb8en18pcguhbj01j30t054kt358ul.apps.googleusercontent.com"
    # Optional email-domain allowlist, e.g. ["gmail.com"] or ["example.org"].
    # Empty means any Google account may sign in.
    allowed_domains: []
    # Map Google account emails to sheet PIDs. On sign-in "This is me" is set
    # to that person, the person card inherits the Gmail avatar, and the panel
    # shows how they are related. Nothing is written to the public JSON.
    people: {
      "vish.ganapathy@gmail.com": P049
    }
      # "you@gmail.com": P049
    # Set to false to sign in without changing the visitor's "This is me".
    auto_me: true

