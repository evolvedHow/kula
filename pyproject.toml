[project]
name = "kula"
version = "2.0.0"
description = "Static, browser-only family tree published with GitHub Pages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "pyswisseph>=2.10",
    "timezonefinder>=6.2",
    "icalendar>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Google API client libraries. Needed for downloading a GEDCOM from Drive
# (--drive-id) or pushing panchang events to a Google Calendar. The .ics feed
# and the site itself need none of these.
google = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
]
# Deprecated alias, kept for backward compatibility.
gcal = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
]

[tool.uv]
package = false
